function startTimer(sec,label){T.end=Date.now()+sec*1000;T.label=label;T.rang=false;saveTimer();$("#timer").classList.add("on");$("#timer").classList.remove("end");$("#tLbl").textContent=label;runTimer()}
function stopTimer(){clearInterval(T.iv);T.end=0;saveTimer();$("#timer").classList.remove("on","end")}
function tick(){if(!T.end)return;const r=(T.end-Date.now())/1000;$("#tVal").textContent=mmss(Math.ceil(r));$("#timer").classList.toggle("end",r<=0);$("#tLbl").textContent=r<=0?"Pause vorbei. Nächster Satz.":T.label;
  if(r<=0){clearInterval(T.iv);if(!T.rang){T.rang=true;if(r>-30){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep()}}const e0=T.end;setTimeout(()=>{if(T.end===e0)stopTimer()},5000)}}
(function(){const t=lsGet("hp3_timer");if(!t||!(t.end>Date.now()-60000)){T.end=0;saveTimer();return}T.end=t.end;T.label=t.label||"Satzpause";T.rang=t.end<=Date.now();$("#timer").classList.add("on");runTimer()})();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;if(actx&&actx.state!=="running")actx.resume().catch(()=>{});if(T.end)runTimer()});


function rirAsk(e,ex){if(!e.sets.length||e.sets.some(x=>!x.done))return "";
  return `<div class="rirq"><span class="small">Wie viele Wdh. wären im letzten Satz noch gegangen?</span><div class="row" style="gap:6px;margin-top:6px">${[0,1,2,3,4].map(v=>`<button class="rpill ${String(e.rir)===String(v)?"on":""}" data-act="rir" data-slot="${ex.id}" data-v="${v}">${v===4?"4+":v}</button>`).join("")}</div></div>`}
/* ---------- Fokusmodus ---------- */
let wakeLock=null;
async function lockScreen(on){try{if(on&&"wakeLock" in navigator){if(!wakeLock||wakeLock.released)wakeLock=await navigator.wakeLock.request("screen")}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ui.focus){lockScreen(true);renderFocus()}});
function fxCur(d,ex){const e=d.ex[ex.id];let i=e.sets.findIndex(x=>!x.done);if(ui.fset!=null&&ui.fset<e.sets.length)i=ui.fset;return i}
function fxDefault(d,ex,i){const e=d.ex[ex.id],st=e.sets[i];const lp=lastPerf(e.name);const prev=i>0?e.sets[i-1]:null;
  const kg=st.kg!==""&&st.kg!=null?num(st.kg):(prev&&prev.kg!==""?num(prev.kg):(num(e.sugKg)??(ex.bw?0:null)));
  const reps=st.reps!==""&&st.reps!=null?num(st.reps):(prev&&prev.done&&num(prev.reps)?num(prev.reps):(lp&&lp.ex.sets[i]?lp.ex.sets[i].reps:ex.lo));
  return {kg,reps,kgSet:st.kg!==""&&st.kg!=null,repsSet:st.reps!==""&&st.reps!=null}}
function renderFocus(){
  const el=$("#focus");if(!ui.focus){el.classList.remove("on");return}
  const day=ui.day,P=PROGRAM[day],d=getDraft(day);const n=P.ex.length;ui.fx=Math.max(0,Math.min(n-1,ui.fx||0));
  const ex=P.ex[ui.fx],e=d.ex[ex.id],sg=suggest(ex,e.name,d);const i=fxCur(d,ex);
  const prog=P.ex.map((x,k)=>{const ee=d.ex[x.id];const all=ee.sets.every(z=>z.done);return `<i class="${all?"d":k===ui.fx?"c":""}"></i>`}).join("");
  let h=`<div class="fx-top"><button class="fx-x" data-act="fclose">Schließen</button><div class="prog">${prog}</div><span class="small muted num">${ui.fx+1}/${n}</span></div>
   <h2 class="fx-name">${esc(e.name)}</h2><p class="fx-meta num">${e.sets.length} × ${ex.lo}–${ex.hi} Wdh. · ${rirText(d,ex)} · ${restTxt(day,ex)}</p>
   ${ssHtml(day,ex,d)}${gnoteHtml(e.name)}
   <div class="fx-sug">${sg.html}</div>${warmupHtml(day,ex,d)}`;
  if(i<0){h+=rirAsk(e,ex)+`<p class="fx-setno">Alle Sätze erledigt</p><p class="small muted" style="text-align:center">${ui.fx<n-1?"Weiter zur nächsten Übung.":"Krafttraining fertig. Unten speichern oder Cardio eintragen."}</p>`;
    h+=ui.fx<n-1?`<button class="btn fx-done" data-act="fnext">Nächste Übung: ${esc(d.ex[P.ex[ui.fx+1].id].name)}</button>`:`<button class="btn fx-done" data-act="fclose">Zum Abschluss</button>`;
    h+=`<button class="ghost" style="margin-top:8px" data-act="addset" data-slot="${ex.id}" data-focus="1">+ Extra-Satz</button>`}
  else{const v=fxDefault(d,ex,i);const st=e.sets[i];
    h+=`<p class="fx-setno">Satz ${i+1} von ${e.sets.length}${st.done?" · erledigt, wird überschrieben":""}</p>
     <div class="stepper"><button data-act="fkg" data-v="-1" aria-label="Gewicht weniger">−</button><div class="v"><input class="fxin num" inputmode="decimal" aria-label="Gewicht kg" data-fk="kg" value="${v.kgSet?esc(fmt(v.kg)):""}" placeholder="${v.kg==null?"kg":fmt(v.kg)}"><small>kg · Schritt ${fmt(ex.inc)}</small></div><button data-act="fkg" data-v="1" aria-label="Gewicht mehr">+</button></div>
     <div class="stepper"><button data-act="freps" data-v="-1" aria-label="Wiederholungen weniger">−</button><div class="v"><input class="fxin num" inputmode="numeric" aria-label="Wiederholungen" data-fk="reps" value="${v.repsSet?v.reps:""}" placeholder="${v.reps==null?"Wdh":v.reps}"><small>Wiederholungen</small></div><button data-act="freps" data-v="1" aria-label="Wiederholungen mehr">+</button></div>
     <p class="small muted" style="text-align:center;margin:2px 0">Grauer Wert ist der Vorschlag. Stimmt er, einfach abhaken. Auf die Zahl tippen zum Eintippen.</p>
     <button class="btn fx-done" data-act="fdone">✓ Satz fertig</button>`}
  h+=`<div class="fx-sets">${e.sets.map((x,k)=>`<button class="${x.done?"d":k===i?"c":""}" data-act="fset" data-i="${k}">${k+1}: ${x.done?`${fmt(num(x.kg)??0)}×${x.reps}`:"offen"}</button>`).join("")}</div>
   <div class="fx-nav"><button class="btn sec" data-act="fprev" ${ui.fx===0?"disabled":""}>← Zurück</button><button class="btn sec" data-act="fnext" ${ui.fx===n-1?"disabled":""}>Weiter →</button></div>
   <details class="cue" data-k="f-${ex.id}" style="margin-top:12px"><summary>Ausführung anzeigen</summary>${techHtml(e.name,ex)}</details>
   ${ex.alts.length?`<button class="ghost" style="margin-top:8px" data-act="swap" data-slot="${ex.id}">Übung tauschen (Gerät besetzt?)</button>`:""}`;
  setHtml(el,h);el.classList.add("on");
}
function openFocus(){const P=PROGRAM[ui.day],d=getDraft(ui.day);const k=P.ex.findIndex(x=>d.ex[x.id].sets.some(z=>!z.done));ui.fx=k<0?P.ex.length-1:k;ui.fset=null;ui.focus=true;lockScreen(true);renderFocus();$("#focus").scrollTop=0}
function closeFocus(){ui.focus=false;ui.fset=null;lockScreen(false);renderFocus();renderHeute()}
function focusAct(act,a){
  const P=PROGRAM[ui.day],d=getDraft(ui.day),ex=P.ex[ui.fx],e=d.ex[ex.id];const i=fxCur(d,ex);
  if(act==="fclose"){closeFocus();return}
  if(act==="fprev"||act==="fnext"){ui.fx+=act==="fnext"?1:-1;ui.fset=null;renderFocus();$("#focus").scrollTop=0;return}
  if(act==="fset"){ui.fset=+a.dataset.i;renderFocus();return}
  if(i<0)return;const st=e.sets[i];const v=fxDefault(d,ex,i);
  if(act==="fkg"){const nv=Math.max(0,Math.round(((v.kg??0)+(+a.dataset.v)*ex.inc)*100)/100);st.kg=String(nv);saveDrafts();renderFocus();return}
  if(act==="freps"){st.reps=String(Math.max(0,(v.reps??ex.lo)+(+a.dataset.v)));saveDrafts();renderFocus();return}
  if(act==="fdone"){if(v.kg==null){toast("Gewicht mit + einstellen.");return}if(!(v.reps>0)){toast("Wiederholungen mit + einstellen.");return}
    st.kg=String(v.kg);st.reps=String(v.reps);st.done=true;ui.fset=null;
    const next=e.sets[i+1];if(next&&(next.kg===""||next.kg==null))next.kg=st.kg;saveDrafts();
    const r=afterSet(ui.day,ex,d);startTimer(r.sec,r.label);if(r.next){ui.fx=P.ex.indexOf(r.next);$("#focus").scrollTop=0}
    renderFocus();return}
}

/* ---------- Speichern ---------- */
function cleanSession(s){const o=JSON.parse(JSON.stringify(s));delete o._pending;return o}
function tombs(){return S.settings.deleted||(S.settings.deleted={})}
function deleteSession(id){const s=S.sessions.find(x=>x.id===id);if(!s)return;ui.lastDel=cleanSession(s);S.sessions=S.sessions.filter(x=>x.id!==id);tombs()[id]=Date.now();delPend()[id]=1;ui.delId=null;putSettings();renderAll(true);toastAct("Einheit gelöscht.","Rückgängig","undo")}
function undoDelete(){const s=ui.lastDel;if(!s)return;delete tombs()[s.id];delete delPend()[s.id];S.sessions.push(s);ui.lastDel=null;putSettings();putSession(s);renderAll(true);toast("Wiederhergestellt.")}
function importData(){const box=$("#importBox");let arr;try{arr=JSON.parse(box.value)}catch(e){toast("Das ist kein gültiger Export. Bitte den kompletten kopierten Text einfügen.");return}
  if(!Array.isArray(arr)){toast("Erwartet wird eine Liste von Einheiten.");return}
  const have=new Set(S.sessions.map(x=>x.id));let add=0,bad=0;
  arr.forEach(x=>{if(!x||typeof x.id!=="string"||!/^s_\d+$/.test(x.id)||typeof x.date!=="string"||isNaN(new Date(x.date))||!PROGRAM[x.day]||!Array.isArray(x.exercises)){bad++;return}
    if(have.has(x.id))return;const ok=x.exercises.every(e=>e&&typeof e.name==="string"&&Array.isArray(e.sets)&&e.sets.every(z=>z&&isFinite(z.kg)&&isFinite(z.reps)));if(!ok){bad++;return}
    const c=JSON.parse(JSON.stringify(x));delete c._pending;if(S.settings.deleted)delete S.settings.deleted[c.id];S.sessions.push(c);have.add(c.id);add++;putSession(c)});
  putSettings();box.value="";renderAll(true);toast(`${add} Einheiten eingelesen${bad?`, ${bad} ungültige übersprungen`:""}.`)}
function toastAct(msg,label,act){toast(msg,7000);const t=$("#toast");if(t){const b=document.createElement("button");b.className="btn sm sec";b.style.marginLeft="10px";b.dataset.act=act;b.textContent=label;t.appendChild(b)}}

async function saveSession(){
  const day=ui.day;const d=getDraft(day);
  const exercises=[];let total=0;
  PROGRAM[day].ex.forEach(ex=>{const e=d.ex[ex.id];const sets=e.sets.filter(s=>s.done&&num(s.reps)>0).map(s=>({kg:num(s.kg)??0,reps:Math.round(num(s.reps))}));total+=sets.length;if(sets.length)exercises.push(Object.assign({slot:ex.id,name:e.name,planned:plannedSets(ex,d),sets},e.rir!=null&&e.rir!==""?{rir:+e.rir}:{}))});
  if(!total){toast("Hake mindestens einen Satz mit Wiederholungen ab.");return}
  const now=new Date().toISOString();
  const s={id:"s_"+Date.now(),date:now,day,week:weekNo(),deload:!!d.deload,recovery:num(d.recovery),sleep:num(d.sleep),hrv:num(d.hrv),strain:num(d.strain),bw:num(d.bw),sauna:num(d.sauna),notes:d.notes||"",exercises,
    cardio:PROGRAM[day].cardio?{done:!!d.cardio.done,type:d.cardio.type,min:num(d.cardio.min),hr:num(d.cardio.hr)}:null};
  S.sessions.push(s);
  if(!S.settings.startDate){S.settings.startDate=now;putSettings()}
  delete drafts[day];saveDrafts();
  ui.day=nextDay();
  renderAll();window.scrollTo({top:0});
  toast(navigator.onLine===false?`Offline gespeichert: ${total} Sätze. Wird synchronisiert, sobald du Netz hast.`:`Gespeichert: ${total} Sätze. Als Nächstes ${PROGRAM[ui.day].title}.`);
  await putSession(s);renderHeader();
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");
  if(tb){ui.tab=tb.dataset.tab;document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b===tb));document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+ui.tab));if(ui.tab==="fortschritt")renderFortschritt();window.scrollTo({top:0});return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(err){}}else if(actx.state!=="running")actx.resume().catch(()=>{});
  if(act==="fopen"){openFocus();return}
  if(act==="gnote"){if(editGnote(a.dataset.name)){renderHeute();if(ui.focus)renderFocus()}return}
  if(act==="keysave"){saveKey($("#k-in").value);return}
  if(act==="keyreset"){try{localStorage.removeItem("hp3_key")}catch(e){}syncState="nokey";renderAll();document.querySelector('[data-tab="heute"]').click();return}
  if(act==="syncnow"){sync(true);return}
  if(act==="rir"){const d=getDraft(ui.day);d.ex[a.dataset.slot].rir=+a.dataset.v;saveDrafts();if(ui.focus)renderFocus();a.parentElement.querySelectorAll(".rpill").forEach(b=>b.classList.toggle("on",b===a));return}
  if(act==="deloadon"){S.settings.deloadUntil=Date.now()+7*DAY_MS;putSettings();for(const k in drafts)if(drafts[k]&&!Object.values(drafts[k].ex).some(e=>e.sets.some(x=>x.done)))delete drafts[k];saveDrafts();renderHeute();toast("Entlastungswoche aktiv für 7 Tage.");return}
  if(act==="import"){importData();return}
  if(/^f(close|prev|next|set|kg|reps|done)$/.test(act)){focusAct(act,a);return}
  if(act==="day"){ui.day=a.dataset.day;applyWhoop();renderHeute();renderHeader();return}
  if(act==="draftkeep"){const d=getDraft(ui.day);d.created=ymd(new Date());saveDrafts();renderHeute();return}
  if(act==="draftdrop"){delete drafts[ui.day];saveDrafts();applyWhoop();renderHeute();toast("Neu gestartet.");return}
  if(act==="undo"){undoDelete();return}
  if(act==="edit"){const s=S.sessions.find(x=>x.id===a.dataset.id);ui.editId=s.id;ui.editBuf=JSON.parse(JSON.stringify(cleanSession(s)));ui.delId=null;renderVerlauf();return}
  if(act==="editcancel"){ui.editId=null;ui.editBuf=null;renderVerlauf();return}
  if(act==="editdelset"){const b=ui.editBuf;b.exercises[+a.dataset.x].sets.splice(+a.dataset.i,1);b.exercises=b.exercises.filter(e=>e.sets.length);renderVerlauf();return}
  if(act==="editsave"){const b=ui.editBuf;b.exercises.forEach(e=>e.sets.forEach(x=>{x.kg=num(x.kg)??0;x.reps=Math.round(num(x.reps)||0)}));b.exercises.forEach(e=>e.sets=e.sets.filter(x=>x.reps>0));b.exercises=b.exercises.filter(e=>e.sets.length);
    const i=S.sessions.findIndex(x=>x.id===b.id);if(i<0)return;b.recovery=num(b.recovery);b.edited=new Date().toISOString();S.sessions[i]=b;ui.editId=null;ui.editBuf=null;putSession(b);for(const k in drafts)if(drafts[k]&&!Object.values(drafts[k].ex).some(e=>e.sets.some(x=>x.done)))delete drafts[k];saveDrafts();renderAll();toast("Änderungen gespeichert.");return}
  if(act==="swap"){const ex=PROGRAM[ui.day].ex.find(x=>x.id===a.dataset.slot);S.settings.swaps[ex.id]=((S.settings.swaps[ex.id]||0)+1)%(ex.alts.length+1);putSettings();renderHeute();renderPlan();if(ui.focus)renderFocus();toast("Getauscht: "+exName(ex));return}
  if(act==="chk"){const d=getDraft(ui.day);const slot=a.dataset.slot,i=+a.dataset.i;const st=d.ex[slot].sets[i];const row=a.closest(".set");
    if(!st.done&&!(num(st.reps)>0)){row.classList.add("flash");row.querySelector('[data-k=reps]').focus();setTimeout(()=>row.classList.remove("flash"),1200);toast("Trag erst die Wiederholungen ein.");return}
    {const exd=PROGRAM[ui.day].ex.find(x=>x.id===slot);if(!st.done&&num(st.kg)==null&&!(exd&&exd.bw)){row.querySelector('[data-k=kg]').focus();toast("Trag das Gewicht ein (bei Körpergewicht 0).");return}}
    st.done=!st.done;row.classList.toggle("done",st.done);a.setAttribute("aria-pressed",st.done);saveDrafts();
    if(st.done){const ex=PROGRAM[ui.day].ex.find(x=>x.id===slot);const next=d.ex[slot].sets[i+1];if(next&&!next.kg){next.kg=st.kg;const inp=document.querySelector(`input[data-slot="${slot}"][data-i="${i+1}"][data-k="kg"]`);if(inp)inp.value=kgTxt(st.kg)}
      const r=afterSet(ui.day,ex,d);startTimer(r.sec,r.label);if(d.ex[slot].sets.every(x=>x.done)){const y=window.scrollY;renderHeute();window.scrollTo(0,y)}}
    return}
  if(act==="addset"){const d=getDraft(ui.day);const e=d.ex[a.dataset.slot];const l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:"",reps:"",done:false,extra:true});saveDrafts();if(ui.focus)renderFocus();else renderHeute();return}
  if(act==="figmode"||act==="figplay"||act==="figslow"){figAct(act,a);return}
  if(act==="wload"||act==="wpull"){sync(true);return}
  if(act==="save"){saveSession();return}
  if(act==="pslot"){const T=proteinTarget();const k=ymd(new Date());const d=protDay(k);const i=+a.dataset.i;d.done[i]=!d.done[i];protSave(k,d);renderErnaehrung();return}
  if(act==="pextra"){const k=ymd(new Date());const d=protDay(k);d.extra=Math.max(0,(d.extra||0)+(+a.dataset.v));protSave(k,d);renderErnaehrung();return}
  if(act==="waistsave"){const v=num($("#n-waist").value);if(!v||v<50||v>180){toast("Bauchumfang bitte in cm.");return}S.settings.waist=Object.assign({},S.settings.waist||{},{[ymd(new Date())]:v});putSettings();renderFortschritt();toast("Bauchumfang gespeichert.");return}
  if(act==="wsave"){const v=num($("#n-today").value),bf=num($("#n-bf").value);const k=ymd(new Date());if(bf!=null){if(bf<3||bf>60){toast("Körperfett bitte in % (3–60).");return}S.settings.bf=Object.assign({},S.settings.bf||{},{[k]:bf})}if(v==null&&bf!=null){putSettings();renderFortschritt();toast("Körperfett gespeichert.");return}if(!v||v<30||v>250){toast("Bitte ein Gewicht in kg eintragen.");return}S.settings.weights=Object.assign({},S.settings.weights||{},{[k]:v});putSettings();renderFortschritt();renderFortschritt();toast("Gewicht gespeichert.");return}
  if(act==="reset"){if(ui.resetArm!==ui.day){ui.resetArm=ui.day;a.textContent="Wirklich alles löschen? Nochmal tippen";a.classList.add("danger");setTimeout(()=>{ui.resetArm=null;if(a.isConnected){a.textContent="Eingaben zurücksetzen";a.classList.remove("danger")}},4000);return}
    ui.resetArm=null;delete drafts[ui.day];saveDrafts();applyWhoop();renderHeute();toast("Eingaben zurückgesetzt.");return}
  if(act==="t-plus"){T.end=Math.max(T.end,Date.now())+15000;T.rang=false;saveTimer();runTimer();return}
  if(act==="t-minus"){T.end-=15000;saveTimer();runTimer();return}
  if(act==="t-stop"){stopTimer();return}
  if(act==="del"){ui.delId=a.dataset.id;renderVerlauf();return}
  if(act==="delno"){ui.delId=null;renderVerlauf();return}
  if(act==="delyes"){deleteSession(a.dataset.id);return}
  if(act==="copy"){const txt=JSON.stringify(sorted().map(cleanSession),null,1);const box=$("#exportBox");
    navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt).then(()=>toast("Daten kopiert."),()=>{box.style.display="block";box.value=txt;box.select();toast("Text markiert, bitte manuell kopieren.")}):(box.style.display="block",box.value=txt,box.select());return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.fk){const P=PROGRAM[ui.day],d=getDraft(ui.day),ex=P.ex[ui.fx],e=d.ex[ex.id];const i=fxCur(d,ex);if(i>=0){e.sets[i][t.dataset.fk]=t.value.replace(",",".");saveDrafts()}return}
  if(t.dataset.ek){const e=ui.editBuf&&ui.editBuf.exercises[+t.dataset.x];if(e)e.sets[+t.dataset.i][t.dataset.ek]=t.value;return}
  if(t.dataset.k){const d=getDraft(ui.day);const st=d.ex[t.dataset.slot].sets[+t.dataset.i];st[t.dataset.k]=t.value;saveDrafts();return}
  const f=t.dataset.f;if(!f)return;
  if(f==="exsel"){ui.exSel=t.value;renderFortschritt();return}
  const d=getDraft(ui.day);
  if(f==="recovery"||f==="sleep"||f==="hrv"||f==="strain"||f==="bw"||f==="sauna"||f==="notes"){d[f]=t.value;if(d.src)delete d.src[f]}
  else if(f==="c-min")d.cardio.min=t.value;else if(f==="c-hr")d.cardio.hr=t.value;
  saveDrafts();
});
document.addEventListener("change",e=>{
  if(e.target.dataset.n){const k=e.target.dataset.n;S.settings.nutri=Object.assign(nutriProfile(),{[k]:e.target.value});putSettings();renderErnaehrung();renderFortschritt();return}
  const t=e.target,f=t.dataset.f;if(!f||f==="exsel")return;const d=getDraft(ui.day);
  if(f==="recovery"){d.recovery=t.value;saveDrafts();renderHeute();return}
  if(f==="deload"){d.deload=t.checked;saveDrafts();renderHeute();return}
  if(f==="c-type"){d.cardio.type=t.value;saveDrafts();return}
  if(f==="c-done"){d.cardio.done=t.checked;saveDrafts();return}
});
