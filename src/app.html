<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hypertrophie 3×</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#111212">
<meta name="app-version" content="__VER__">
<style>
/* Schriften liegen lokal (src/fonts, SIL Open Font License), damit die App offline gleich aussieht. */
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  /* Layout: Handy-App, eine Spalte, Tabs unten. Sichtbeton-Grau mit Signal-Gelb wie im Studio. */
  color-scheme: dark;
  --bg:#111212; --surface:#1b1c1c; --surface2:#252626; --line:#333434;
  --ink:#ecebe6; --muted:#9d9c95; --accent:#f0c43c; --accent-ink:#1b1600;
  --good:#3cb874; --mid:#e3a83c; --bad:#e5574f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:1.65rem;line-height:1.1}
h2{font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:1.2rem;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}

header.top{position:sticky;top:0;z-index:20;background:rgba(17,18,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top .sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.cloud i{background:var(--good)} .pill.local i{background:var(--mid)}

main{max-width:560px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.view{display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}

.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.day b{font-family:var(--display);font-size:1.25rem}
.day span{font-size:.74rem;color:var(--muted);line-height:1.25}
.day.on{border-color:var(--accent);background:var(--surface2)}
.day em{font-style:normal;font-size:.68rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.field label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0;font-size:1rem}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:#5f5f5b}

.zone{border-radius:12px;padding:10px 12px;border-left:5px solid var(--muted);background:var(--surface2);display:flex;flex-direction:column;gap:3px}
.zone.good{border-color:var(--good)} .zone.mid{border-color:var(--mid)} .zone.bad{border-color:var(--bad)}
.zone strong{font-family:var(--display);font-size:1.1rem;letter-spacing:.02em}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.75rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.good{background:rgba(60,184,116,.18);color:var(--good)}
.chip.mid{background:rgba(227,168,60,.18);color:var(--mid)}
.chip.bad{background:rgba(229,87,79,.18);color:var(--bad)}
.chip.acc{background:var(--accent);color:var(--accent-ink)}

.toggle{display:flex;align-items:center;gap:10px;font-size:.92rem}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

.banner{background:rgba(240,196,60,.1);border:1px solid rgba(240,196,60,.45);border-radius:12px;padding:10px 12px;font-size:.92rem}

.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-no{font-family:var(--display);font-weight:700;font-size:.95rem;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:3px 7px;line-height:1.1;margin-top:2px}
.ex-head .t{flex:1;min-width:0}
.gear{font-size:.82rem;color:var(--muted)}
.swap{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.78rem;color:var(--muted)}
.target{font-weight:600;font-size:.95rem}
.sugg{font-size:.88rem;background:var(--surface2);border-radius:10px;padding:8px 10px;color:#d7d6d0}
.sugg b{color:var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 48px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.set .u{position:relative}
.set .u input{padding-right:38px;text-align:right}
.set .u span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.78rem;color:var(--muted);pointer-events:none}
.chk{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.15rem;color:var(--muted)}
.set.done .chk{background:var(--good);border-color:var(--good);color:#06150c}
.set.done input{border-color:rgba(60,184,116,.5)}
.set.flash input[data-k=reps]{border-color:var(--bad)}
.ghost{background:none;border:1px dashed var(--line);border-radius:10px;padding:8px;color:var(--muted);font-size:.86rem}
details.cue summary{cursor:pointer;color:var(--muted);font-size:.85rem}
details.cue p{font-size:.9rem;margin-top:6px}

.btn{border:none;border-radius:12px;padding:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.02rem;letter-spacing:.01em}
.btn.sec{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,21,21,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:none;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.74rem;font-weight:600}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent)}

.focus{position:fixed;inset:0;z-index:35;background:var(--bg);display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom));overflow-y:auto}
.focus.on{display:flex}
.fx-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fx-top .prog{flex:1;display:flex;gap:4px}
.fx-top .prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.fx-top .prog i.d{background:var(--good)}.fx-top .prog i.c{background:var(--accent)}
.fx-x{background:var(--surface2);border:none;color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700}
.fx-name{font-family:var(--display);font-size:1.55rem;font-weight:700;line-height:1.15;margin:8px 0 2px}
.fx-meta{color:var(--muted);font-size:.88rem;margin:0 0 6px}
.fx-sug{font-size:.9rem;background:var(--surface);border-radius:10px;padding:8px 10px;margin:4px 0 10px}
.fx-setno{text-align:center;font-weight:700;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;font-size:.8rem;margin:6px 0}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center;margin:6px 0}
.stepper button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:1.9rem;font-weight:700}
.stepper .v{text-align:center;font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}
.fxin{width:100%;background:transparent;border:none;text-align:center;font-family:var(--display);font-size:2.6rem;font-weight:700;color:var(--ink);padding:0;line-height:1.1}
.fxin::placeholder{color:var(--muted);opacity:1}
.stepper .v small{display:block;font-family:inherit;font-size:.75rem;color:var(--muted);font-weight:600;margin-top:4px}
.stepper .v.ghost{color:var(--muted)}
.fx-done{height:68px;font-size:1.2rem;margin-top:10px;width:100%}
.fx-sets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.fx-sets button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.82rem}
.fx-sets button.d{background:rgba(60,184,116,.18);border-color:var(--good)}
.fx-sets button.c{border-color:var(--accent);color:var(--accent)}
.fx-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.fx-start{width:100%;margin:4px 0 12px}
.rirq{background:var(--surface2);border-radius:10px;padding:8px 10px;margin:8px 0}
.rpill{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;min-width:44px;height:40px;font-weight:700}
.rpill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.timer{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:40;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:536px;margin:0 auto}
.timer.on{display:flex}
.timer.end{background:var(--good)}
.timer .tv{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1;min-width:84px}
.timer .lb{flex:1;font-size:.85rem;font-weight:600;line-height:1.2}
.timer button{background:rgba(0,0,0,.14);border:none;border-radius:8px;padding:8px 10px;font-weight:700;color:var(--accent-ink)}

.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;z-index:50;font-size:.92rem;display:none;width:max-content;max-width:90vw}
.toast.on{display:block}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .v{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1}
.tile .k{font-size:.78rem;color:var(--muted);margin-top:4px}
svg.chart{width:100%;height:auto;display:block}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}

.hist details{border-top:1px solid var(--line);padding:10px 0}
.hist details:first-of-type{border-top:none}
.hist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.hist .lines{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.hist .lines div{display:flex;justify-content:space-between;gap:10px}
.hist .lines span:last-child{color:var(--muted);text-align:right}

table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
table.tbl td,table.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.tbl th{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.plan-ex{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.plan-ex:last-child{border-bottom:none}
.plan-ex .c{font-family:var(--display);color:var(--accent);font-weight:700}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
details.cue{border-top:1px solid var(--line);padding-top:8px}
details.cue[open] summary{color:var(--accent)}
ol.steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
ul.errs{margin:0;padding-left:18px;font-size:.9rem;color:#e7b1ad}
.lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:8px}
.pbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0}.pbar>div{height:100%;border-radius:5px}
.plist{display:grid;gap:8px;margin-top:10px}
.pslot{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font-size:.95rem}
.pslot.on{border-color:var(--good);background:rgba(60,184,116,.12)}
.pchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--good)}
.pslot.on .pchk{border-color:var(--good);background:var(--good);color:#0b1a10}
.pweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.pw{height:48px;background:var(--line);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:2px}.pw i{display:block;width:100%;border-radius:6px}
.fig{background:#0b0c0c;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px}
.fig svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.fig .fl{stroke:#3a3b3b;stroke-width:2}
.fig .limb{stroke:#f2f1ec;stroke-width:6.5;stroke-linecap:round}
.fig .limb.far{stroke:#a9a8a2;stroke-width:5.5}
.fig .limb.neck{stroke-width:5}
.fig .limb.foot{stroke-width:5}
.fig .torso{stroke:#f2f1ec;stroke-width:11;stroke-linecap:round}
.fig .torsoF{fill:#f2f1ec;stroke:#f2f1ec;stroke-width:6;stroke-linejoin:round}
.fig .joint{fill:#0b0c0c}
.fig .head{fill:#f2f1ec}
.fig .mus{stroke:#ff7a3d;stroke-width:6.5;stroke-linecap:round;opacity:.95}
.fig .gh{opacity:.25}
.fig .frm{stroke:#6d6c67;stroke-width:3;stroke-linecap:round;fill:none}
.fig .frame{fill:#1d1e1e;stroke:#55554f;stroke-width:1.5}
.fig .stack{fill:#2e2f2f;stroke:#55554f;stroke-width:1}
.fig .pad{fill:#3a2f22;stroke:#7a6448;stroke-width:1.2}
.fig .padf{fill:#2a231a;stroke:#6b573e;stroke-width:1.2}
.fig .rail{stroke:#8d8c86;stroke-width:2.5}.fig .rail.thin{stroke-width:1.2;opacity:.6}
.fig .sled{stroke:#c9c8c2;stroke-width:5;stroke-linecap:round}
.fig .lever{stroke:#9c9b95;stroke-width:4;stroke-linecap:round}
.fig .roller{fill:#3a2f22;stroke:#b39064;stroke-width:1.5}
.fig .plate{fill:#252626;stroke:#f0c43c;stroke-width:2.2}
.fig .hub{fill:#f0c43c}
.fig .dbh{fill:#9c9b95}.fig .dbp{fill:#252626;stroke:#f0c43c;stroke-width:1.6}
.fig .pul{fill:#252626;stroke:#c9c8c2;stroke-width:1.5}
.fig .cab{stroke:#c9c8c2;stroke-width:1.3}
.fig .barH{stroke:#f0c43c;stroke-width:3.5;stroke-linecap:round}
.fig .ropeE{stroke:#f0c43c;stroke-width:3;stroke-linecap:round}
.fig .vh{fill:none;stroke:#f0c43c;stroke-width:2.5;stroke-linejoin:round}
.fig .arw{stroke:#5fd38d;stroke-width:3;stroke-linecap:round}.fig .arwh{fill:#5fd38d}
.fig .cuem circle{fill:#f0c43c}.fig .cuem text{fill:#1b1600;font:700 8px system-ui,sans-serif;text-anchor:middle}
.fig .hud{fill:#f0c43c;font:700 9.5px system-ui,sans-serif}.fig .hudbar{fill:#f0c43c;opacity:.7}
.figbar{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:6px}
.ghost.sm2{padding:6px 10px;font-size:.78rem}
.ssl{font-size:.82rem;color:var(--accent);font-weight:600;margin:0}
.warm{font-size:.88rem;background:var(--surface2);border-left:3px solid var(--mid);border-radius:8px;padding:6px 10px;margin:0}
.gnote{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);margin:0}
.gnote span{color:var(--ink)}
.figleg{margin-top:6px;font-size:.86rem}
.figleg p{margin:4px 0;display:flex;gap:8px;align-items:flex-start}
.musdot{flex:0 0 auto;width:12px;height:12px;border-radius:3px;background:#ff7a3d;margin-top:3px}
.cuen{flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:#f0c43c;color:#1b1600;font-weight:700;font-size:.7rem;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.offline{background:rgba(227,168,60,.12);border:1px solid rgba(227,168,60,.5);border-radius:12px;padding:10px 12px;font-size:.9rem}
a.vid{display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;font-size:.9rem}
.meal{border-top:1px solid var(--line);padding-top:6px}
.food{display:grid;grid-template-columns:1fr auto 54px;gap:8px;font-size:.92rem;padding:2px 0}
.food span:nth-child(3){text-align:right}
.wk{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.wk:last-child{border-bottom:none}
.wk b{font-family:var(--display);font-size:1.05rem}
.wk.tr b{color:var(--accent)}
.wk.now{background:var(--surface2);border-radius:8px;padding-left:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 id="hTitle">Hypertrophie 3×</h1>
    <div class="sub num" id="hSub">Ganzkörper A · B · C</div>
  </div>
  <span class="pill" id="sync"><i></i><span>Verbinde…</span></span>
</header>

<main>
  <section class="view on" id="v-heute"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-verlauf"></section>
  <section class="view" id="v-ernaehrung"></section>
  <section class="view" id="v-fortschritt"></section>
</main>

<div class="focus" id="focus" role="dialog" aria-label="Fokusmodus"></div>
<div class="timer" id="timer" role="timer" aria-live="polite">
  <div class="tv num" id="tVal">0:00</div>
  <div class="lb" id="tLbl">Satzpause</div>
  <button data-act="t-minus" aria-label="15 Sekunden weniger">−15</button>
  <button data-act="t-plus" aria-label="15 Sekunden mehr">+15</button>
  <button data-act="t-stop" aria-label="Pause beenden">✕</button>
</div>
<div class="toast" id="toast" role="status"></div>

<nav class="tabs" aria-label="Bereiche">
  <button data-tab="heute" class="on"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Training</button>

      {id:"A5",ss:"a",name:"Seitheben am Kabel",gear:"Kabelturm, unterer Zug",sets:4,lo:12,hi:20,rest:75,inc:2.5,iso:true,m:{side:1},cue:"Leicht nach vorn geneigt, der Ellbogen führt, bis Schulterhöhe.",alts:["Seitheben Kurzhantel"]},

      {id:"A7",name:"Wadenheben an der Beinpresse",gear:"Technogym Leg Press, Fußballen an der Plattenkante",sets:3,lo:10,hi:20,rest:60,inc:5,iso:true,m:{calves:1},cue:"Unten volle Dehnung 1 s halten, ganz hoch auf die Zehen.",alts:["Wadenheben Smith-Maschine"]}
     ]},
  B:{title:"Tag B", focus:"Kreuzheben · Schrägbank · Rudern",

     ex:[
      {id:"B1",name:"Rumänisches Kreuzheben",gear:"Langhantel",bar:true,sets:3,lo:6,hi:10,rest:150,inc:2.5,m:{hams:1,glutes:.5},cue:"Hüfte nach hinten schieben, Stange nah am Bein, Rücken neutral, bis deutliche Dehnung im Beinbeuger.",alts:["Rumänisches Kreuzheben Kurzhantel","Hyperextension"]},
      {id:"B2",name:"Schrägbankdrücken Kurzhantel",gear:"Verstellbare Bank, ca. 30°",sets:3,lo:8,hi:12,rest:120,inc:2,m:{chest:1,tri:.5},cue:"Bank flach anstellen, Hanteln tief absenken, oben nicht zusammenschlagen.",alts:["Schrägbankdrücken Smith-Maschine"]},
      {id:"B3",name:"Rudern sitzend eng",gear:"Kabelturm mit Ruderbank",sets:3,lo:8,hi:12,rest:120,inc:5,m:{back:1,bi:.5,rear:.5},cue:"Aufrecht sitzen, Griff zum Bauchnabel, Schulterblätter zusammen, vorne lang machen.",alts:["Kurzhantel-Rudern einarmig"]},
      {id:"B4",name:"Beinpresse",gear:"Technogym Leg Press",sets:3,lo:10,hi:15,rest:120,inc:5,m:{quads:1,glutes:.5},cue:"Füße mittig, tief gehen ohne dass das Becken abrollt, Knie oben nicht durchdrücken.",alts:["Kniebeuge Smith-Maschine"]},
      {id:"B5",name:"Beinbeuger-Curl sitzend",gear:"Beinbeuger-Maschine (sitzend)",sets:3,lo:8,hi:12,rest:90,inc:5,iso:true,m:{hams:1},cue:"Knie auf Höhe der Drehachse, Oberkörper leicht nach vorn, Fersen unter den Sitz ziehen, langsam strecken.",alts:["Beinbeuger-Curl am Kabel","Nordic Curls"]},
      {id:"B6",ss:"b",name:"Seitheben Kurzhantel",gear:"Kurzhanteln",sets:4,lo:12,hi:20,rest:75,inc:2,iso:true,m:{side:1},cue:"Leicht nach vorn geneigt, Arme seitlich bis Schulterhöhe.",alts:["Seitheben am Kabel"]},
      {id:"B7",ss:"b",name:"Bizeps-Curls Kurzhantel",gear:"Kurzhantelablage",sets:3,lo:10,hi:15,rest:75,inc:2,iso:true,m:{bi:1},cue:"Ellbogen ruhig, unten ganz strecken, ohne Schwung.",alts:["Bizeps-Curls Kabel"]}
     ]},
  C:{title:"Tag C", focus:"Split Squats · Fliegende · Klimmzüge",
     cardio:{min:"15–20", dev:"Laufband mit Steigung", text:"Zone 2 als Gehen mit Steigung auf dem Laufband (ca. 5 km/h, 8–12 %), alternativ Rudergerät oder ruhig schwimmen. Bei roter Recovery nur lockeres Gehen ohne Steigung."},
     ex:[
      {id:"C1",name:"Bulgarische Split Squats",gear:"Kurzhanteln + Bank",sets:3,lo:8,hi:12,rest:120,inc:2,m:{quads:1,glutes:.5},cue:"Wiederholungen pro Bein. Oberkörper leicht nach vorn für mehr Gesäß, kontrolliert absenken.",alts:["Beinpresse einbeinig"]},
      {id:"C2",name:"Kabel-Fliegende",gear:"Kabelturm, Züge auf Schulterhöhe",sets:3,lo:10,hi:15,rest:90,inc:2.5,iso:true,m:{chest:1},cue:"Leicht gebeugte Ellbogen, weite Dehnung, vorne Brust zusammendrücken.",alts:["Kurzhantel-Fliegende"]},
      {id:"C3",name:"Klimmzüge Untergriff",gear:"Rack · 0 kg = Körpergewicht",sets:3,lo:6,hi:12,rest:120,inc:2.5,bw:true,m:{back:1,bi:.5},cue:"Unten ganz aushängen, Brust zur Stange. Zu schwer? Auf Latzug eng tauschen.",alts:["Latzug eng Untergriff"]},
      {id:"C4",name:"Beinbeuger-Curl sitzend",gear:"Beinbeuger-Maschine (sitzend)",sets:3,lo:10,hi:15,rest:75,inc:5,iso:true,m:{hams:1},cue:"Knie auf Höhe der Drehachse, Oberkörper leicht nach vorn, Fersen unter den Sitz ziehen, langsam strecken.",alts:["Beinbeuger-Curl am Kabel","Nordic Curls"]},
      {id:"C5",ss:"c",name:"Face Pulls Seil",gear:"Kabelturm, Stirnhöhe",sets:3,lo:12,hi:20,rest:75,inc:2.5,iso:true,m:{rear:1},cue:"Seil zur Stirn, Hände auseinander, Daumen zeigen nach hinten.",alts:["Reverse Flys Kurzhantel"]},
      {id:"C6",ss:"c",name:"Überkopf-Trizeps Kabel",gear:"Kabelturm, Seil",sets:2,lo:10,hi:15,rest:75,inc:2.5,iso:true,m:{tri:1},cue:"Ellbogen nach vorn oben, tief in die Dehnung, Ellbogen ruhig halten.",alts:["Trizepsdrücken Seil"]},
      {id:"C7",ss:"d",name:"Wadenheben an der Beinpresse",gear:"Technogym Leg Press, Fußballen an der Plattenkante",sets:3,lo:10,hi:20,rest:60,inc:5,iso:true,m:{calves:1},cue:"Unten volle Dehnung 1 s halten, ganz hoch auf die Zehen.",alts:["Wadenheben Smith-Maschine"]},
      {id:"C8",ss:"d",name:"Kabel-Crunch",gear:"Kabelturm, Seil oben",sets:2,lo:10,hi:15,rest:60,inc:5,iso:true,m:{abs:1},cue:"Kniend, Rippen Richtung Becken einrollen, Hüfte bleibt stehen.",alts:["Abduktoren"]}
     ]}
};
const MUSCLES=[["chest","Brust"],["back","Rücken (Lat)"],["quads","Quadrizeps"],["hams","Beinbeuger"],["glutes","Gesäß"],["side","Seitliche Schulter"],["rear","Hintere Schulter"],["tri","Trizeps"],["bi","Bizeps"],["calves","Waden"],["abs","Bauch"]];
function weeklyVolume(){const v={};ORDER_ALL.forEach(k=>PROGRAM[k].ex.forEach(ex=>Object.entries(ex.m||{}).forEach(([mu,f])=>{v[mu]=(v[mu]||0)+ex.sets*f})));return v}
const ORDER_ALL=["A","B","C"];
const ORDER=["A","B","C"];
const DAY_MS=864e5;

/* ---------- Zustand ---------- */
let S={sessions:[],settings:{swaps:{},startDate:null}};
let drafts={};
let ui={tab:"heute",day:null,exSel:null,delId:null};
let syncState="loading";

function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function saveLocal(){lsSet("hp3_cache",S)}
function saveDrafts(){lsSet("hp3_drafts",drafts)}
(function load(){const c=lsGet("hp3_cache");if(c&&Array.isArray(c.sessions)){S.sessions=c.sessions;S.settings=Object.assign({swaps:{},startDate:null},c.settings||{})}drafts=lsGet("hp3_drafts")||{}})();

const $=s=>document.querySelector(s);
/* Neu zeichnen, ohne dass eine offene "Ausführung anzeigen" zuklappt */
function setHtml(el,html){const open=[...el.querySelectorAll("details[data-k][open]")].map(x=>x.dataset.k);el.innerHTML=html;open.forEach(k=>{const x=el.querySelector(`details[data-k="${k}"]`);if(x)x.open=true})}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
/* Gewicht im Eingabefeld mit Komma zeigen. Gespeichert wird weiter als Zahl, num() liest Punkt und Komma. */
const kgTxt=v=>String(v??"").replace(".",",");
const fmt=n=>n==null?"–":(Math.round(n*10)/10).toLocaleString("de-DE");
const fmtDate=iso=>new Date(iso).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
const shortDate=iso=>new Date(iso).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const sorted=()=>[...S.sessions].sort((a,b)=>a.date<b.date?-1:1);

function exName(ex){const list=[ex.name,...ex.alts];return list[(S.settings.swaps[ex.id]||0)%list.length]}
function nextDay(){const s=sorted();if(!s.length)return "A";return ORDER[(ORDER.indexOf(s[s.length-1].day)+1)%3]}
function zone(r){r=num(r);if(r==null)return null;return r>=67?"good":r>=34?"mid":"bad"}
function startDate(){if(S.settings.startDate)return S.settings.startDate;const s=sorted();return s.length?s[0].date:null}
function weekNo(){const sd=startDate();if(!sd)return 1;const a=new Date(sd);a.setHours(0,0,0,0);return Math.floor((Date.now()-a)/ (7*DAY_MS))+1}
function isDeloadWeek(){return deloadStatus().due}
function deloadActive(){return !!(S.settings.deloadUntil&&Date.now()<S.settings.deloadUntil)}
/* Persönliche Tagesform: Recovery + HRV relativ zum eigenen 30-Tage-Schnitt */
function hrvBase(excl){const h=(whoop.hist&&whoop.hist.hrvs)||[];const v=h.filter(x=>x.d!==excl).slice(-30).map(x=>x.v);if(v.length<10)return null;const m=v.reduce((a,b)=>a+b,0)/v.length;const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/v.length);return {m,sd:Math.max(sd,0.08*m,1),n:v.length}}
function hrvZ(v,base){return base&&v!=null?(v-base.m)/base.sd:null}
function readiness(d){
  const rec=num(d.recovery),hrv=num(d.hrv);const t=ymd(new Date());const b=hrvBase(t);const z=hrvZ(hrv,b);
  const h=(whoop.hist&&whoop.hist.hrvs)||[];const prev=[...h].reverse().find(x=>x.d<t);const zp=prev?hrvZ(prev.v,b):null;
  if(rec==null&&z==null)return {z:null,why:""};
  let zone,why;
  if(rec!=null&&rec<34){zone="bad";why=`Recovery ${rec} % ist rot.`}
  else if(z!=null&&z<-1&&zp!=null&&zp<-1){zone="bad";why="HRV den zweiten Tag in Folge deutlich unter deinem Schnitt."}
  else if(z!=null&&z<-1){zone="mid";why="HRV heute deutlich unter deinem Schnitt."}
  else if(z==null&&rec!=null&&rec<50){zone="mid";why=`Recovery ${rec} %, ohne genug HRV-Verlauf vorsichtig bewertet.`}
  else {zone="good";why=z!=null?"HRV im Bereich deines persönlichen Schnitts.":`Recovery ${rec} %.`}
  const base=b&&hrv!=null?` HRV heute ${Math.round(hrv)} ms, dein 30-Tage-Schnitt ${Math.round(b.m)} ± ${Math.round(b.sd)} ms.`:"";
  return {z:zone,why:why+base}
}
function dayZone(d){return readiness(d).z}
/* Entlastung nach Bedarf */
function deloadStatus(){
  const s=sorted();let i=s.length-1;let n=0;while(i>=0&&!s[i].deload){n++;i--}
  const main=["A1","A2","A3","B1","B2","B3","C1","C3"];let stuck=0,checked=0;
  main.forEach(slot=>{const xs=s.filter(x=>!x.deload).map(x=>{const e=(x.exercises||[]).find(e=>e.slot===slot);return e&&{e,bw:x.bw}}).filter(Boolean);
    const byName=xs.filter(o=>o.e.name===xs[xs.length-1]?.e.name).slice(-6);if(byName.length<6)return;checked++;
    /* Körpergewichtsübungen (Klimmzüge): Körpergewicht mitrechnen, sonst ist die Schätzung bei 0 kg immer 0 und gilt als Stillstand */
    const best=({e,bw})=>{const add=isBwName(e.name)?(bw||latestWeight()||80):0;return Math.max(...e.sets.map(z=>e1rm((z.kg||0)+add,z.reps||0)))};const a=Math.max(...byName.slice(0,3).map(best)),b=Math.max(...byName.slice(3).map(best));if(b<=a*1.005)stuck++});
  const h=(whoop.hist&&whoop.hist.hrvs)||[];let down=false;if(h.length>=21){const v=h.slice(-30).map(x=>x.v),w=h.slice(-7).map(x=>x.v);const m=v.reduce((a,b)=>a+b,0)/v.length,sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/v.length);const m7=w.reduce((a,b)=>a+b,0)/w.length;down=m7<m-0.5*sd}
  const reasons=[];if(stuck>=2)reasons.push(`${stuck} Grundübungen stagnieren seit 3 Einheiten`);if(down)reasons.push("dein HRV-Wochenschnitt liegt unter deinem Monatsschnitt");
  let due=false,why="";
  if(n>=24){due=true;why=`${n} Einheiten seit der letzten Entlastung (spätestens nach ca. 8 Wochen).`}
  else if(n>=15&&(stuck>=2||(stuck>=1&&down))){due=true;why=reasons.join(" und ")+"."}
  return {due,n,why,stuck,down}
}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x}

function plannedSets(ex,d){let n=ex.sets;if(d.deload)return Math.max(1,Math.ceil(n/2));if(dayZone(d)==="bad")return Math.max(2,n-1);return n}
function rirText(d,ex){if(d.deload)return "RIR 3–4, locker";const z=dayZone(d);if(z==="bad")return "RIR 3";if(z==="mid")return "RIR 2";if(z==="good")return ex&&ex.iso?"RIR 1, letzter Satz bis 0–1":"RIR 1–2";return "RIR 1–2"}

function lastPerfs(name,k){const s=sorted(),out=[];for(let i=s.length-1;i>=0&&out.length<k;i--){if(s[i].deload)continue;const e=(s[i].exercises||[]).find(x=>x.name===name);if(e&&e.sets&&e.sets.length)out.push({sess:s[i],ex:e})}return out}
const roundTo=(v,st)=>Math.max(st,Math.round(v/st)*st);
function lastPerf(name){const s=sorted();for(let i=s.length-1;i>=0;i--){if(s[i].deload)continue;const e=(s[i].exercises||[]).find(x=>x.name===name);if(e&&e.sets&&e.sets.length)return {sess:s[i],ex:e}}return null}

function suggest(ex,name,d){
  const lp=lastPerf(name);
  if(!lp)return {kg:"",html:`Erstes Mal: Wähle ein Gewicht, mit dem du <b>${ex.lo} saubere Wdh.</b> schaffst und noch 2 im Tank hast.`};
  const sets=lp.ex.sets;const top=Math.max(...sets.map(s=>s.kg||0));
  const work=sets.filter(s=>(s.kg||0)===top);
  const last=`Letztes Mal (${shortDate(lp.sess.date)}): ${fmt(top)} kg × ${work.map(s=>s.reps).join(" · ")}`;
  const below=work.some(s=>s.reps<ex.lo);
  /* Grundübungen: steigern, wenn der Schnitt höchstens 1 Wdh. unter dem oberen Ende liegt (z. B. 10 · 9 · 8 bei 6–10).
     Isolationsübungen: erst, wenn alle Sätze das obere Ende schaffen (kleine Gewichte, große Sprünge). */
  const avgR=work.reduce((a,s)=>a+(s.reps||0),0)/Math.max(1,work.length);
  const allTop=work.length>=Math.min(ex.sets,lp.ex.planned||ex.sets)&&(ex.iso?work.every(s=>s.reps>=ex.hi):!below&&avgR>=ex.hi-1);
  const topTxt=ex.iso||work.every(s=>s.reps>=ex.hi)?"Alle Sätze am oberen Ende":`Im Schnitt ${fmt(avgR)} Wdh., nah am oberen Ende`;
  const z=dayZone(d);const rir=lp.ex.rir;const rirTxt=rir!=null?` · Reserve ${rir>=4?"4+":rir}`:"";
  const last2=`${last}${rirTxt}`;
  if(d.deload){const dk=roundTo(top*0.9,ex.inc);return {kg:String(dk),html:`${last2}<br>Entlastung: <b>${fmt(dk)} kg</b> (ca. −10 %), halbe Sätze, 3–4 Wdh. Reserve.`}}
  const two=lastPerfs(name,2);
  if(two.length===2&&two.every(p=>{const t=Math.max(...p.ex.sets.map(x=>x.kg||0));return t>=top&&p.ex.sets.filter(x=>(x.kg||0)===t).some(x=>x.reps<ex.lo)})){const dk=roundTo(top*0.92,ex.inc);
    return {kg:String(dk),html:`${last2}<br>Zweimal in Folge unter ${ex.lo} Wdh. → heute <b>${fmt(dk)} kg</b> (ca. −8 %) und sauber wieder aufbauen.`}}
  if(!allTop&&!below&&rir!=null&&rir>=3&&z!=="bad"){const nk=Math.round((top+ex.inc)*10)/10;return {kg:String(nk),html:`${last2}<br>Letzter Satz hatte noch ${rir>=4?"4+":rir} Wdh. Reserve, das war zu leicht → heute <b>${fmt(nk)} kg</b>.`}}
  if(allTop&&z!=="bad"){const nk=Math.round((top+ex.inc)*10)/10;return {kg:String(nk),html:`${last2}<br>${topTxt} → heute <b>${fmt(nk)} kg</b> (+${fmt(ex.inc)}).`}}
  if(allTop&&z==="bad")return {kg:String(top),html:`${last2}<br>Steigerung wäre fällig, bei roter Recovery aber <b>${fmt(top)} kg halten</b>.`};
  if(below)return {kg:String(top),html:`${last2}<br>Unter ${ex.lo} Wdh. → <b>${fmt(top)} kg halten</b> und Wiederholungen aufbauen.`};
  return {kg:String(top),html:`${last2}<br>Ziel heute: <b>${fmt(top)} kg</b>, pro Satz +1 Wdh.`};
}

/* Supersätze: zwei Übungen mit gleichem ss im Wechsel. Nach jedem Satz kurze Pause, dann der Partner. */
const SS_SWITCH=40;
function partnerOf(day,ex){return ex.ss?PROGRAM[day].ex.find(x=>x!==ex&&x.ss===ex.ss)||null:null}
function afterSet(day,ex,d){const e=d.ex[ex.id],pt=partnerOf(day,ex);
  if(pt&&d.ex[pt.id].sets.some(z=>!z.done))return {sec:SS_SWITCH,label:`Wechsel: ${d.ex[pt.id].name}`,next:pt};
  const last=!e.sets.some(z=>!z.done);return {sec:ex.rest,label:last?"Pause bis zur nächsten Übung":`Satzpause ${e.name}`,next:null}}
function ssHtml(day,ex,d){const pt=partnerOf(day,ex);if(!pt)return "";return `<p class="ssl">Supersatz mit ${pt.id} ${esc(d.ex[pt.id].name)} · im Wechsel, ${SS_SWITCH} s Pause dazwischen</p>`}
function restTxt(day,ex){return partnerOf(day,ex)?`Pause im Wechsel ${mmss(SS_SWITCH)}`:`Pause ${mmss(ex.rest)}`}
/* Aufwärmen: vor den ersten beiden Grundübungen des Tages (ohne Isolation und Körpergewicht) */
function warmIds(day){return PROGRAM[day].ex.filter(x=>!x.iso&&!x.bw).slice(0,2).map(x=>x.id)}
function warmupHtml(day,ex,d){const e=d.ex[ex.id];if(!warmIds(day).includes(ex.id)||e.sets.some(z=>z.done))return "";
  const base=num(e.sets[0]&&e.sets[0].kg)??num(e.sugKg);
  if(!base)return `<p class="warm"><b>Aufwärmen:</b> 2 Sätze mit ca. 50 % × 8 und 75 % × 4 deines Arbeitsgewichts.</p>`;
  const bar=ex.bar&&e.name===ex.name;const w=f=>{const v=roundTo(base*f,ex.inc);return bar&&v<20?"leere Stange":fmt(v)+" kg"};
  return `<p class="warm"><b>Aufwärmen:</b> ${w(0.5)} × 8 · ${w(0.75)} × 4, dann Arbeitssätze.</p>`}
/* Geräte-Einstellung je Übung (z. B. Sitz 4, Polster 2), gespeichert in settings.gnotes */
function gnote(name){return (S.settings.gnotes||{})[name]||""}
function gnoteHtml(name){const n=gnote(name);return n?`<p class="gnote"><span>⚙ ${esc(n)}</span><button class="ghost sm2" data-act="gnote" data-name="${esc(name)}">ändern</button></p>`:`<p class="gnote"><button class="ghost sm2" data-act="gnote" data-name="${esc(name)}">+ Geräte-Einstellung notieren</button></p>`}
function editGnote(name){const cur=gnote(name);const v=window.prompt(`Geräte-Einstellung für ${name} (z. B. Sitz 4, Polster 2):`,cur);if(v==null)return false;
  const t=String(v).trim().slice(0,80);const all=Object.assign({},S.settings.gnotes||{});if(t)all[name]=t;else delete all[name];S.settings.gnotes=all;putSettings();return true}
function getDraft(day){
  let d=drafts[day];
  if(!d){d=drafts[day]={created:ymd(new Date()),recovery:"",sleep:"",hrv:"",deload:deloadActive(),ex:{},cardio:{done:false,min:"",hr:"",type:day==="C"?"Laufband (Steigung)":"Spinning-Bike"},sauna:"",strain:"",bw:"",notes:""}}
  PROGRAM[day].ex.forEach(ex=>{
    const name=exName(ex);
    if(!d.ex[ex.id]||d.ex[ex.id].name!==name){const sg=suggest(ex,name,d);d.ex[ex.id]={name,sets:[]};d.ex[ex.id].sugKg=sg.kg}
    const e=d.ex[ex.id],n=plannedSets(ex,d);
    while(e.sets.length<n)e.sets.push({kg:e.sets.length?e.sets[e.sets.length-1].kg:(e.sugKg||""),reps:"",done:false});
    while(e.sets.length>n){const l=e.sets[e.sets.length-1];if(l.done||l.extra||String(l.reps||"")!=="")break;e.sets.pop()}
  });
  return d;
}

/* ---------- Render: Training ---------- */

   <p class="small wstat" id="wstat">${whoopStatusHtml()}</p>

  </div>`;

  {const DS=deloadStatus();if(DS.due&&!d.deload)h+=`<div class="banner"><b>Entlastung empfohlen.</b> ${esc(DS.why)} Eine Woche mit halben Sätzen und ca. −10 % Gewicht, danach geht es stärker weiter. <div class="row" style="margin-top:8px"><button class="btn sm" data-act="deloadon">Diese Woche entlasten</button></div></div>`;}

     <p class="sugg">${sg.html}</p>

        <button class="chk" data-act="chk" data-slot="${ex.id}" data-i="${i}" aria-label="Satz ${i+1} abhaken" aria-pressed="${s.done}">✓</button>

/* ---------- Render: Plan ---------- */
function renderPlan(){
  const tw=new Date().getDay();
  let h=`<div class="card"><h2>Deine Woche</h2>
   <p>Training <b>Di · Fr · So</b>, dazwischen immer mindestens ein Ruhetag. Die App wählt automatisch die nächste Einheit A → B → C. Fällt ein Termin aus, machst du beim nächsten einfach dort weiter.</p>
   <div>${WEEK.map(x=>`<div class="wk ${TRAIN_WD.includes(x.wd)?"tr":""} ${x.wd===tw?"now":""}"><b>${WD[x.wd]}</b><span><b style="font-family:var(--body);font-size:.93rem">${x.t}</b><br><span class="small muted">${x.d}</span></span></div>`).join("")}</div>
   <p class="small muted">Dauer pro Einheit: ca. 65–80 min inklusive Cardio. Harte Sätze pro Muskel und Woche (Grundübungen zählen für Hilfsmuskeln halb):</p>
   <table class="tbl num"><tbody>${(()=>{const v=weeklyVolume();return MUSCLES.map(([k,l])=>`<tr><td>${l}</td><td style="text-align:right">${fmt(v[k]||0)}</td><td style="width:45%"><div style="height:6px;border-radius:3px;background:${(v[k]||0)>=8?"var(--good)":(v[k]||0)>=5?"var(--mid)":"var(--muted)"};width:${Math.min(100,(v[k]||0)/14*100)}%"></div></td></tr>`).join("")})()}</tbody></table>
   <p class="small muted">Richtwert für Muskelaufbau: ca. 8–16 Sätze pro großer Muskelgruppe. Waden und Bauch brauchen weniger.</p></div>`;
  ORDER.forEach(k=>{const P=PROGRAM[k];
    h+=`<div class="card"><div class="row between"><h2>${P.title}</h2><span class="small muted">${P.focus}</span></div><div>`+
    P.ex.map(ex=>`<div class="plan-ex"><span class="c">${ex.id}</span><span>${esc(exName(ex))}<br><span class="small muted">${esc(ex.gear)}</span>${ex.ss?`<br><span class="ssl">Supersatz mit ${partnerOf(k,ex).id}</span>`:""}</span><span class="num small">${ex.sets}×${ex.lo}–${ex.hi}</span></div>`).join("")+
    (P.cardio?`<div class="plan-ex"><span class="c">+</span><span>Cardio Zone 2<br><span class="small muted">${P.cardio.dev}</span></span><span class="num small">${P.cardio.min} min</span></div>`:"")+`</div></div>`});
  h+=`<div class="card"><h2>Progression</h2><ul class="rules">
    <li><b>Doppelte Progression:</b> Bleib beim Gewicht und bau Wiederholungen auf. <b>Grundübungen</b> steigerst du, sobald du im Schnitt höchstens 1 Wdh. unter dem oberen Ende liegst und kein Satz unter dem Bereich ist (z. B. 10 · 9 · 8 bei 6–10). <b>Isolationsübungen</b> erst, wenn alle Sätze das obere Ende schaffen, weil dort jeder Schritt ein großer Sprung ist. Der Schritt steht bei jeder Übung: meist +2,5 kg, Kurzhanteln +2 kg, Beinpresse, Latzug und Rudern +5 kg. Die App rechnet das für dich aus.</li>
    <li><b>Früher steigern:</b> Hattest du im letzten Satz noch 3 oder mehr Wdh. Reserve, geht das Gewicht schon beim nächsten Mal hoch.</li>
    <li><b>Supersätze:</b> Kleine Übungen für verschiedene Muskeln machst du im Wechsel (z. B. Seitheben und Trizeps), mit 40 s Pause dazwischen. Jeder Muskel hat trotzdem rund 2 Minuten Pause, die Einheit wird ein paar Minuten kürzer.</li>
    <li><b>Zurückgehen:</b> Zweimal in Folge unter dem Wiederholungsbereich, dann ca. 8 % leichter und sauber wieder aufbauen.</li>
    <li><b>Intensität:</b> Arbeitssätze enden 1–2 Wdh. vor dem Versagen (RIR 1–2). Technik bleibt sauber.</li>
    <li><b>Entlastung nach Bedarf:</b> Die App empfiehlt sie ab 15 Einheiten, wenn zwei Grundübungen seit 3 Einheiten nicht stärker werden. Eine reicht, wenn zusätzlich dein HRV-Wochenschnitt unter dem Monatsschnitt liegt. Spätestens nach 24 Einheiten (ca. 8 Wochen). Dann eine Woche halbe Sätze und ca. 10 % weniger Gewicht.</li>
    <li><b>Ernährung:</b> Bei über ca. 20 % Körperfett ist Rekomposition am effektivsten: leichtes Defizit (ca. −300 kcal), ca. 1,9 g Eiweiß pro kg, schwer trainieren. Muskeln wachsen trotzdem, Fett geht runter. Ab ca. 18 % auf schlanken Aufbau (+150 kcal) wechseln.</li></ul></div>
  <div class="card"><h2>Whoop-Regeln</h2><ul class="rules">
    <li>Die Tagesform richtet sich vor allem nach deiner <b>HRV im Vergleich zu deinem eigenen 30-Tage-Schnitt</b>. Das sagt mehr als feste Recovery-Grenzen.</li>
    <li><span class="chip bad">Rot</span> Recovery unter 34 % oder HRV den zweiten Tag in Folge deutlich unter deinem Schnitt. Ein Satz weniger pro Übung, Gewichte halten, RIR 3, Cardio nur Gehen.</li>
    <li><span class="chip mid">Gelb</span> HRV heute deutlich unter deinem Schnitt. Solange noch keine 10 Tage HRV vorliegen: Recovery unter 50 %. Plan komplett, jeder Satz mit RIR 2.</li>
    <li><span class="chip good">Grün</span> Alles andere. Plan komplett, letzter Satz bei Isolationsübungen darf bis RIR 0–1.</li>
    <li>Schlaf ist einer der größten Hebel: zu wenig Schlaf bremst Regeneration und Muskelaufbau nachweislich. Eine feste Grenze gibt es nicht, achte auf den Trend im Verlauf.</li>
    <li>Ein einzelner Recovery-Wert sagt deine Tagesform nur grob voraus. Wichtiger ist, wie sich der erste Arbeitssatz anfühlt: Läuft er deutlich schwerer als letztes Mal, nimm die gelbe Regel.</li></ul></div>
  <div class="card"><h2>Cardio</h2><ul class="rules">
    <li>2× pro Woche 15–20 min Zone 2 nach Tag A (Di) und C (So). Das stärkt Herz und Erholung, ohne den Muskelaufbau zu bremsen.</li>
    <li><b>Geräte-Reihenfolge für Muskelaufbau:</b> Spinning-Bike und Rad zuerst. Radfahren hat kaum Bremsbewegung, belastet die Gelenke wenig und stört die Regeneration der Beine am geringsten. Danach Gehen mit Steigung auf dem Laufband und Schwimmen. Das Rudergerät ist super, beansprucht aber zusätzlich Rücken und Griff, also lieber nicht direkt nach Tag B (Kreuzheben, Rudern).</li>
    <li><b>Laufen</b> nur gelegentlich und kurz: Die Stoßbelastung kostet bei 3 Kraft-Einheiten am meisten Bein-Erholung.</li>
    <li>Immer <b>nach</b> dem Krafttraining, nie davor.</li>
    <li>Optional an einem freien Tag 30–45 min Gehen oder lockeres Rad, wenn die Recovery grün ist.</li>
    <li>Schwimmen ersetzt Rudergerät oder Rad 1:1, solange du ruhig und gleichmäßig schwimmst. Die Whoop misst im Wasser ungenauer, nimm das Gefühl "locker unterhalten können" als Maßstab.</li>
    <li>Keine harten Intervalle. Sie konkurrieren bei 3 Krafteinheiten am stärksten mit der Regeneration der Beine.</li></ul></div>`;
  h+=`<div class="card"><h2>Schwimmen &amp; Sauna</h2><ul class="rules">
    <li><b>Aktiver Ruhetag (Mittwoch):</b> 20–30 min lockeres Schwimmen, danach Sauna. Schont die Gelenke, fördert die Durchblutung und zählt nicht als harte Belastung. Bei grüner oder gelber Recovery jederzeit, bei roter nur entspannt.</li>
    <li><b>Sauna nach dem Training:</b> 2–3 Gänge à 10–15 min bei 80–90 °C, dazwischen abkühlen. Das hilft beim Runterfahren und verbessert oft den Schlaf, also deinen wichtigsten Erholungswert in der Whoop.</li>
    <li><b>Nie vor dem Krafttraining:</b> Hitze vorher kostet Kraft und Kreislauf.</li>
    <li><b>Trinken:</b> Pro Gang etwa ein Glas Wasser, bei viel Schweiß etwas Salz dazu. Kein Alkohol rund um die Sauna.</li>
    <li>Ein voller Trainingstag mit Schwimmen und Sauna erhöht den Whoop-Strain. Das ist normal, beobachte nur, ob die Recovery am Folgetag stabil bleibt.</li></ul></div>`;
  $("#v-plan").innerHTML=h;
}

/* ---------- Render: Verlauf ---------- */

  return `<div class="card" style="margin:8px 0;border-color:var(--accent)"><div class="row between"><h3>${fmtDate(b.date)} · ${esc(PROGRAM[b.day]?.title||b.day)} bearbeiten</h3></div>
   ${b.exercises.map((e,x)=>`<p class="lbl">${esc(e.name)}</p>${e.sets.map((st,i)=>`<div class="set" style="grid-template-columns:28px 1fr 1fr 40px"><span class="muted num">${i+1}</span><input inputmode="decimal" aria-label="kg" data-ek="kg" data-x="${x}" data-i="${i}" value="${esc(kgTxt(st.kg))}"><input inputmode="numeric" aria-label="Wdh." data-ek="reps" data-x="${x}" data-i="${i}" value="${esc(String(st.reps))}"><button class="btn sec sm" aria-label="Satz löschen" data-act="editdelset" data-x="${x}" data-i="${i}">×</button></div>`).join("")}`).join("")}
   <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sec sm" data-act="editcancel">Abbrechen</button><button class="btn sm" data-act="editsave">Änderungen speichern</button></div></div>`;
}

     <div><span>Volumen</span><span class="num">${Math.round(v).toLocaleString("de-DE")} kg</span></div>
     ${s.sauna?`<div><span>Sauna</span><span class="num">${s.sauna} Gäng${s.sauna===1?"":"e"}</span></div>`:""}

     ${s.bw!=null?`<div><span>Körpergewicht</span><span class="num">${fmt(s.bw)} kg</span></div>`:""}

/* ---------- Charts ---------- */
function lineChart(pts,{unit="",color="var(--accent)",bands=null,fixed=null,goals=null}={}){
  if(pts.length<2)return `<p class="empty">Noch zu wenige Daten. Ab 2 Einheiten erscheint hier die Kurve.</p>`;
  const W=340,H=170,L=38,R=14,T=14,B=24;
  let ys=pts.map(p=>p.y).concat((goals||[]).map(g=>g.v));let lo=fixed?fixed[0]:Math.min(...ys),hi=fixed?fixed[1]:Math.max(...ys);
  if(!fixed){const pad=(hi-lo)*0.15||Math.max(1,hi*0.05);lo=Math.max(0,lo-pad);hi=hi+pad}
  const xs=pts.map(p=>p.x);const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;
  const X=x=>L+(x1===x0?0:(x-x0)/(x1-x0))*(W-L-R);const Y=y=>T+(1-(y-lo)/(hi-lo))*(H-T-B);
  let g="";for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;const y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`}
  let gl="";(goals||[]).forEach(G=>{const y=Y(G.v).toFixed(1);gl+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${G.c||"var(--good)"}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+4}" y="${(+y-4).toFixed(1)}" font-size="10" fill="${G.c||"var(--good)"}">${esc(G.l)}</text>`});
  let bd="";if(bands){bands.forEach(b=>{bd+=`<rect x="${L}" width="${W-L-R}" y="${Y(b.to)}" height="${Y(b.from)-Y(b.to)}" fill="${b.c}" opacity=".08"/>`})}
  const path=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=path+` L${X(pts[pts.length-1].x).toFixed(1)} ${H-B} L${X(pts[0].x).toFixed(1)} ${H-B} Z`;
  const lp=pts[pts.length-1];
  const dots=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.4" fill="${color}"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${bd}${g}${gl}<path d="${area}" fill="${color}" opacity=".13"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${dots}<circle cx="${X(lp.x)}" cy="${Y(lp.y)}" r="5" fill="${color}" stroke="var(--bg)" stroke-width="2"/><text x="${Math.min(X(lp.x),W-R)}" y="${Math.max(Y(lp.y)-10,11)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">${fmt(lp.y)}${unit}</text><text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${shortDate(new Date(x0))}</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--muted)">${shortDate(new Date(x1))}</text></svg>`;
}
function barChart(items){
  if(!items.length)return `<p class="empty">Noch keine Wochen erfasst.</p>`;
  const W=340,H=150,L=28,R=8,T=14,B=24;const max=Math.max(30,...items.map(i=>i.v));const bw=(W-L-R)/items.length;
  let g="";[0,max/2,max].forEach(v=>{const y=T+(1-v/max)*(H-T-B);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v)}</text>`});
  const bars=items.map((it,i)=>{const h=(it.v/max)*(H-T-B);const x=L+i*bw+bw*0.18;return `<rect x="${x}" y="${H-B-h}" width="${bw*0.64}" height="${h}" rx="3" fill="${i===items.length-1?"var(--accent)":"#5c5b55"}"/><text x="${x+bw*0.32}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${it.l}</text>`}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg>`;
}

/* ---------- Whoop über n8n ---------- */
let whoop=Object.assign({state:"idle",msg:"",at:null,today:null,hist:null,weight:null},lsGet("hp3_whoop")||{});
if(whoop.state==="loading")whoop.state="idle";
function ymd(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function saveWhoop(){lsSet("hp3_whoop",{at:whoop.at,today:whoop.today,hist:whoop.hist,weight:whoop.weight,state:whoop.state==="ok"?"ok":"idle"})}
function applyWhoop(){
  const T=whoop.today;if(!T||T.d!==ymd(new Date()))return;
  const d=getDraft(ui.day);let ch=false;
  const set=(k,v)=>{if(v==null)return;if(d[k]===""||d[k]==null||d.src&&d.src[k]==="whoop"){if(String(d[k])!==String(v)){d[k]=String(v);ch=true}d.src=Object.assign({},d.src,{[k]:"whoop"})}};
  set("recovery",T.rec);set("sleep",T.sleep);set("hrv",T.hrv);set("strain",T.strain);
  saveDrafts();return ch;
}
function whoopStatusHtml(){
  const T=whoop.today,t=ymd(new Date());
  if(whoop.state==="loading")return `<span class="muted">${esc(whoop.msg||"Lade Whoop-Daten…")}</span>`;
  if(whoop.state==="offline")return `<span class="muted">Offline. ${whoop.at?"Letzter Whoop-Stand: "+new Date(whoop.at).toLocaleString("de-DE",{weekday:"short",hour:"2-digit",minute:"2-digit"}):"Keine Whoop-Daten geladen."} Lade die App vor dem Studio einmal mit Netz.</span>`;
  if(whoop.state==="error"||whoop.state==="nodata")return `<span>${esc(whoop.msg)}</span> <button class="ghost sm2" data-act="wload">Erneut versuchen</button>`;
  if(whoop.state==="ok"){
    const stale=!T||T.d!==t;
    return `<span class="chip good">Whoop</span> <span class="muted">${stale?`Für heute noch keine Recovery (letzte: ${whoop.hist&&whoop.hist.lastRec?shortDate(whoop.hist.lastRec+"T12:00"):"–"}). Strap synchronisieren, dann „Jetzt abrufen“.`:`Automatisch übernommen · ${new Date(whoop.at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}${T.rhr?` · Ruhepuls ${T.rhr}`:""}`}</span> <button class="ghost sm2" data-act="wpull">Jetzt abrufen</button>`;
  }
  return `<button class="ghost sm2" data-act="wload">Whoop-Daten laden</button>`;
}
function renderWhoop(){const el=document.getElementById("wstat");if(el)el.innerHTML=whoopStatusHtml()}
/* ---------- Withings über n8n ---------- */
let withings=lsGet("hp3_withings")||{rows:[],at:null};
function withingsCard(){
  const rows=withings.rows||[];if(!rows.length)return "";
  const bf=rows.filter(r=>r.bf!=null).map(r=>({x:new Date(r.d+"T12:00").getTime(),y:r.bf}));
  const mm=rows.filter(r=>r.mm!=null).map(r=>({x:new Date(r.d+"T12:00").getTime(),y:r.mm}));
  const lb=[...rows].reverse().find(r=>r.bf!=null);
  return `<div class="card"><h2>Körperzusammensetzung</h2>
   <p class="small muted">Von deiner Withings-Waage. Körperfett misst sie nur barfuß, deshalb gibt es nicht jeden Tag einen Wert.${lb?` Letzte Messung ${shortDate(lb.d+"T12:00")}: ${fmt(lb.bf)} % Fett, ${fmt(lb.mm)} kg Muskelmasse.`:""}</p>
   <p class="lbl">Muskelmasse kg</p>${lineChart(mm,{unit:" kg",color:"var(--accent)"})}
   <p class="lbl">Körperfett % · Ziel unter 20 %</p>${lineChart(bf,{unit:" %",color:"#e3a83c",goals:[{v:20,l:"Ziel 20 %"}]})}
   <p class="small muted">Ziel: Muskelmasse hält oder steigt, Körperfett sinkt Richtung 20 %. Ab ca. 18 % lohnt sich dann schlanker Aufbau. Einzelwerte schwanken mit Wasserhaushalt, achte auf den Trend über 4 Wochen.</p></div>`;
}
function whoopHistCard(){
  if(!whoop.hist||!whoop.hist.recs.length)return "";
  const rp=whoop.hist.recs.map(x=>({x:new Date(x.d+"T12:00").getTime(),y:x.rec}));
  const sp=whoop.hist.sleeps.map(x=>({x:new Date(x.d+"T12:00").getTime(),y:x.perf}));
  const av=a=>a.length?Math.round(a.reduce((s,p)=>s+p.y,0)/a.length):null;
  const trainDays=new Set(sorted().map(s=>s.date.slice(0,10)));
  const tr=whoop.hist.recs.filter(x=>trainDays.has(x.d)),nt=whoop.hist.recs.filter(x=>!trainDays.has(x.d));
  return `<div class="card"><h2>Whoop, letzte 30 Tage</h2>
   <p class="small muted num">Ø Recovery ${av(rp)??"–"} % · Ø Schlaf ${av(sp)??"–"} %${tr.length?` · an Trainingstagen ${Math.round(tr.reduce((s,x)=>s+x.rec,0)/tr.length)} %`:""}</p>
   ${lineChart(rp,{unit:" %",color:"var(--good)",fixed:[0,100],bands:[{from:0,to:34,c:"#e5574f"},{from:34,to:67,c:"#e3a83c"},{from:67,to:100,c:"#3cb874"}]})}
   <p class="lbl">Schlafleistung</p>${lineChart(sp,{unit:" %",color:"#9fb7d9",fixed:[0,100]})}</div>`;
}

function techHtml(name,ex){
  const t=TECH[name];
  const yt="https://www.youtube.com/results?search_query="+encodeURIComponent((t?t.q:name)+" richtige Ausführung");
  const fig=figHtml(name);
  if(!t)return `${fig}<p>${esc(ex.cue)}</p><a class="vid" href="${yt}" target="_blank" rel="noopener">Zusätzlich: Videos auf YouTube (nur mit Internet)</a>`;
  return `${fig}<ol class="steps">${t.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <p class="lbl">Typische Fehler</p><ul class="errs">${t.f.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   <p class="lbl">Tempo und Atmung</p><p>${esc(t.t)}</p>
   <a class="vid" href="${yt}" target="_blank" rel="noopener">Zusätzlich: Videos auf YouTube (nur mit Internet)</a>`;
}

const PAIRS=[["hp","kn"],["kn","an"],["sh","el"],["el","ha"],["hp","kn2"],["kn2","an2"],["sh","el2"],["el2","ha2"],["an","to"],["hpL","hpR"],["hpL","knL"],["knL","anL"],["hpR","knR"],["knR","anR"],["shL","elL"],["elL","haL"],["shR","elR"],["elR","haR"]];
const fx=n=>(+n).toFixed(1);
function figBody(p,cls,f){
  let h=`<g class="${cls}">`;
  if(p.nk){h+=SVGP([p.shL,p.shR,p.hpR||p.hp,p.hpL||p.hp],"torsoF")}else if(p.sh&&p.hp)h+=SVGL(p.sh[0],p.sh[1],p.hp[0],p.hp[1],"torso");
  PAIRS.forEach(([a,b])=>{if(p[a]&&p[b]){const back=(a.endsWith("2")||b.endsWith("2"));h+=SVGL(p[a][0],p[a][1],p[b][0],p[b][1],back?"limb far":"limb")}});
  const base=p.nk||p.sh;
  if(base&&p.hd){const dx=base[0]-p.hd[0],dy=base[1]-p.hd[1],d=Math.hypot(dx,dy)||1;h+=SVGL(p.hd[0]+dx/d*8,p.hd[1]+dy/d*8,base[0],base[1],"limb neck")}
  if(p.an&&!p.nk&&!p.to&&!(f&&f.foot))h+=SVGL(p.an[0],p.an[1],p.an[0]+11,p.an[1],"limb foot");
  if(f&&f.foot==="plate"&&p.an)h+=SVGL(p.an[0],p.an[1],p.an[0]-PERP[0]*11,p.an[1]-PERP[1]*11,"limb foot");
  ["kn","el","kn2","knL","knR","elL","elR"].forEach(k=>{if(p[k])h+=SVGC(p[k][0],p[k][1],2.2,"joint")});
  if(p.hd)h+=`<circle cx="${fx(p.hd[0])}" cy="${fx(p.hd[1])}" r="8.5" class="head"/>`;
  return h+"</g>";
}
function segPart(p,a,b,f0,f1){const A=p[a],B=p[b];if(!A||!B)return "";return SVGL(A[0]+(B[0]-A[0])*f0,A[1]+(B[1]-A[1])*f0,A[0]+(B[0]-A[0])*f1,A[1]+(B[1]-A[1])*f1,"mus")}
function lerpPose(a,b,t){const o={};for(const k in a){o[k]=b[k]?[a[k][0]+(b[k][0]-a[k][0])*t,a[k][1]+(b[k][1]-a[k][1])*t]:a[k]}for(const k in b)if(!o[k])o[k]=b[k];return o}
const ease=x=>x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function phaseAt(f,sec){
  const ph=f.ph||PH_DOWN;const tot=ph.reduce((s,x)=>s+x[1],0);let r=sec%tot;
  for(let i=0;i<4;i++){const d=ph[i][1];if(r<d||i===3){const q=d?Math.min(1,r/d):1;const t=i===0?ease(q):i===1?1:i===2?1-ease(q):0;return {i,t,q,label:ph[i][0],dur:d}}r-=d}
}
const reduceMotion=(()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();
function arrowSvg(from,to){const dx=to[0]-from[0],dy=to[1]-from[1],d=Math.hypot(dx,dy);if(d<0.05)return "";const ux=dx/d,uy=dy/d;
  const s=[from[0]+ux*9,from[1]+uy*9],e=[from[0]+ux*24,from[1]+uy*24];const l=[e[0]-ux*6-uy*4,e[1]-uy*6+ux*4],r=[e[0]-ux*6+uy*4,e[1]-uy*6-ux*4];
  return SVGL(s[0],s[1],e[0],e[1],"arw")+SVGP([e,l,r],"arwh")}
function drawFig(svg,t,info){
  const f=FIG[svg.dataset.fig];if(!f)return;const fl=f.floor||152;
  const stat=reduceMotion||svg.dataset.static;
  const p=stat?f.b:lerpPose(f.a,f.b,t);
  let h=SVGL(0,fl,200,fl,"fl");
  if(stat){h+=(f.eq?`<g class="gh">${f.eq(f.a)}</g>`:"")+figBody(f.a,"bd gh",f)}
  h+=(f.eq?f.eq(p):"")+figBody(p,"bd",f);
  (f.hl||[]).forEach(x=>{h+=segPart(p,x[0],x[1],x[2],x[3])});
  (f.cues||[]).forEach((c,i)=>{const j=p[c[0]];if(j)h+=`<g class="cuem"><circle cx="${fx(j[0]+9)}" cy="${fx(j[1]-9)}" r="6"/><text x="${fx(j[0]+9)}" y="${fx(j[1]-6.6)}">${i+1}</text></g>`});
  if(!stat&&info&&f.track&&info.i%2===0){const j0=p[f.track];const p2=lerpPose(f.a,f.b,info.i===0?Math.min(1,t+0.06):Math.max(0,t-0.06));const j1=p2[f.track];if(j0&&j1)h+=arrowSvg(j0,j1)}
  if(stat)h+=`<text class="hud" x="6" y="13">Grau = Start · Weiß = Endposition</text>`;
  else if(info){const sym=info.i===0||info.i===2?(info.i===0?"▶":"◀"):"‖";h+=`<text class="hud" x="6" y="13">${sym} ${esc(info.label)}${info.dur>=0.8?` · ${String(info.dur).replace(".",",")} s`:""}</text><rect class="hudbar" x="6" y="17" width="${fx(60*info.q)}" height="2.5" rx="1"/>`}
  svg.innerHTML=h;
}
const ANIM=new Set();let animRun=false;
function animLoop(now){
  if(!ANIM.size){animRun=false;return}
  ANIM.forEach(svg=>{if(!svg.isConnected){ANIM.delete(svg);return}const f=FIG[svg.dataset.fig];if(!f)return;
    const st=svg._st||(svg._st={t0:now,acc:0,last:now});const slow=svg.dataset.slow?0.5:1;
    if(!svg.dataset.paused)st.acc+=(now-st.last)/1000*slow;st.last=now;
    const info=phaseAt(f,st.acc);drawFig(svg,info.t,info)});
  requestAnimationFrame(animLoop);
}
function startAnim(svg){if(reduceMotion||svg.dataset.static)return;ANIM.add(svg);if(!animRun){animRun=true;requestAnimationFrame(animLoop)}}
function figHtml(name){const k=PAT[name];const f=k&&FIG[k];if(!f)return "";
  return `<div class="fig"><svg class="anim" data-fig="${k}" viewBox="0 0 200 160" role="img" aria-label="Bewegungsablauf ${esc(name)}"></svg>
  <div class="figbar"><button class="ghost sm2" data-act="figplay">Pause</button><button class="ghost sm2" data-act="figslow">Zeitlupe</button><button class="ghost sm2" data-act="figmode">Start/Ende</button></div>
  <div class="figleg"><p><span class="musdot"></span><b>Arbeitet:</b> ${esc(f.mus||"")}</p>${(f.cues||[]).map((c,i)=>`<p><span class="cuen">${i+1}</span>${esc(c[1])}</p>`).join("")}${f.note?`<p class="muted">${esc(f.note)}</p>`:""}<p class="muted small">Pfeil = Bewegungsrichtung. Oben links: aktuelle Phase und Tempo.</p></div></div>`}
function figAct(act,a){const svg=a.closest(".fig").querySelector("svg");
  if(act==="figplay"){if(svg.dataset.paused){delete svg.dataset.paused;a.textContent="Pause"}else{svg.dataset.paused="1";a.textContent="Weiter"}return}
  if(act==="figslow"){if(svg.dataset.slow){delete svg.dataset.slow;a.textContent="Zeitlupe"}else{svg.dataset.slow="1";a.textContent="Normal"}return}
  if(act==="figmode"){if(svg.dataset.static){delete svg.dataset.static;a.textContent="Start/Ende";startAnim(svg)}else{svg.dataset.static="1";ANIM.delete(svg);a.textContent="Animation";drawFig(svg,1)}}}
document.addEventListener("toggle",e=>{
  const d=e.target;if(!d.classList||!d.classList.contains("cue"))return;
  d.querySelectorAll("svg.anim").forEach(svg=>{
    if(d.open){drawFig(svg,0,phaseAt(FIG[svg.dataset.fig]||{},0));startAnim(svg)}
    else ANIM.delete(svg);
  });
},true);

function nutriProfile(){const n=Object.assign({h:"",age:"",sex:"m",act:"1.55",goal:"-300",w:""},S.settings.nutri||{});return n}
function latestWeight(){const all=weightSeries();return all.length?all[all.length-1].y:null}
function weightSeries(){const m={};sorted().forEach(s=>{if(s.bw!=null)m[ymd(s.date)]=s.bw});Object.entries(S.settings.weights||{}).forEach(([k,v])=>{m[k]=v});(typeof withings!=="undefined"&&withings.rows||[]).forEach(r=>{if(r.w!=null)m[r.d]=r.w});return Object.keys(m).sort().map(k=>({x:new Date(k+"T12:00:00").getTime(),y:m[k],k}))}
function targets(){
  const n=nutriProfile();const w=num(n.w)||latestWeight();const h=num(n.h),a=num(n.age);
  if(!w||!h||!a)return null;
  const bmr=10*w+6.25*h-5*a+(n.sex==="w"?-161:5);
  const maint=bmr*parseFloat(n.act);const avg=maint+parseFloat(n.goal);
  const trainK=avg+150,restK=avg-150*3/4;
  const mk=k=>{const p=2*w,f=0.9*w;const c=(k-p*4-f*9)/4;return {k:Math.round(k/10)*10,p:Math.round(p),f:Math.round(f),c:Math.round(c)}};
  return {w,bmr:Math.round(bmr),maint:Math.round(maint),train:mk(trainK),rest:mk(restK),water:Math.round(w*35/100)/10};
}
function macroOf(key,g){const f=FOOD[key];return {k:f[1]*g/100,p:f[2]*g/100,c:f[3]*g/100,f:f[4]*g/100}}
function scaleDay(type,T){
  const meals=MEALS[type];let P={k:0,p:0},E={k:0,p:0},F={k:0,p:0};
  meals.forEach(m=>m.i.forEach(([key,g,r])=>{const x=macroOf(key,g);const b=r==="p"?P:r==="e"?E:F;b.k+=x.k;b.p+=x.p}));
  let kP=1,kE=1;
  for(let it=0;it<6;it++){kP=Math.max(0.7,(T.p-E.p*kE-F.p)/P.p);kE=Math.max(0.3,(T.k-P.k*kP-F.k)/E.k)}
  const out=meals.map(m=>({n:m.n,i:m.i.map(([key,g,r])=>{const gg=Math.max(5,Math.round(g*(r==="p"?kP:r==="e"?kE:1)/5)*5);return {key,g:gg,...macroOf(key,gg)}})}));
  const tot={k:0,p:0,c:0,f:0};out.forEach(m=>m.i.forEach(x=>{tot.k+=x.k;tot.p+=x.p;tot.c+=x.c;tot.f+=x.f}));
